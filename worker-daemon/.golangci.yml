version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gosec
    - misspell
    - modernize
    - noctx
    - sloglint
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Diagnostics to stderr have nowhere to report their own failure.
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable:
        - unusedwrite
    sloglint:
      attr-only: true
      static-msg: true
      key-naming-case: snake
    modernize:
      disable:
        # omitzero changes how struct-typed fields marshal to JSON.
        - omitzero
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/briancappello/agentic-orchestration/worker-daemon

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
