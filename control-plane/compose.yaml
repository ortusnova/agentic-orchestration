# The Ortus Nova control plane: one compose project under rootless podman
# (docs/operator-guide.md). Start, stop and check it with cp.sh, which
# turns the files in $CP_HOME/secrets into podman secrets first: no secret
# is a value in this file or a layer of an image.
#
# Images built from this repository and the Sortie fork are tagged with the
# commit they were built from ($CP_TAG, `make images`); every other image is
# pinned by digest (pin-images.sh).
#
# Networks: `internal` has no route out; every service is on it. `outside`
# carries the ports published on the host (Pomerium for worker hosts, the
# workbench and Huly for people) and the egress of Sortie (the forge) and
# nono (the model and forge APIs).
name: ortus-cp

networks:
  internal:
    name: ortus-cp-internal
    internal: true
    ipam:
      config:
        - subnet: 10.89.71.0/24
  outside:
    name: ortus-cp-outside

secrets:
  cp-sortie-control-token: {external: true}
  cp-nono-pass: {external: true}
  cp-workbench-secret: {external: true}
  cp-viewer-token: {external: true}
  cp-huly-secret: {external: true}
  cp-pomerium-cert: {external: true}
  cp-pomerium-key: {external: true}
  cp-egress-ca-cert: {external: true}
  cp-egress-ca-key: {external: true}
  cp-github-token: {external: true}
  cp-github-basic: {external: true}
  cp-anthropic-token: {external: true}
  cp-huly-token: {external: true}
  cp-workbench-password-hash: {external: true}

volumes:
  sortie-data:
  workbench-data:
  huly-cockroach:
  huly-redpanda:
  huly-minio:

services:
  # Sortie binds only its address on the internal network, so only
  # Pomerium, the egress gate and the workbench reach it. TLS ends at
  # Pomerium: Sortie serves plain HTTP there, and the flows its workflow
  # names are Pomerium's https URLs (design D14.4).
  sortie:
    image: localhost/ortus-nova/sortie:${CP_TAG:?}
    container_name: cp-sortie
    restart: unless-stopped
    command: ["--host", "10.89.71.10", "--port", "7680", "/etc/sortie/WORKFLOW.md"]
    volumes:
      - sortie-data:/var/lib/sortie
      - ${CP_SORTIE_CONFIG_DIR:?set CP_SORTIE_CONFIG_DIR to the directory of Sortie's WORKFLOW.md}:/etc/sortie:z
    secrets:
      - {source: cp-sortie-control-token, type: env, target: SORTIE_CONTROL_TOKEN}
      - {source: cp-github-token, type: env, target: SORTIE_GITHUB_TOKEN}
      - {source: cp-huly-token, type: env, target: SORTIE_HULY_TOKEN}
      - cp-viewer-token
    networks:
      internal:
        ipv4_address: 10.89.71.10
      outside: {}
    # The workbench shares this network namespace (it reaches the
    # acp-broker of each session on loopback), so its port is published
    # here.
    ports:
      - "127.0.0.1:${CP_WORKBENCH_PORT:-8793}:8793"
    healthcheck:
      test: ["CMD", "/usr/local/bin/cp-probe", "http://10.89.71.10:7680/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30

  workbench:
    image: localhost/ortus-nova/workbench:${CP_TAG:?}
    container_name: cp-workbench
    restart: unless-stopped
    network_mode: "service:sortie"
    depends_on: [sortie]
    command: ["workbench", "serve", "--host", "0.0.0.0", "--port", "8793"]
    environment:
      WORKBENCH_HOME: /var/lib/workbench/home
      WORKBENCH_RUNTIME_DIR: /var/lib/workbench/sessions
      WORKBENCH_SORTIE_URL: http://10.89.71.10:7680
    volumes:
      - workbench-data:/var/lib/workbench
    secrets:
      - {source: cp-sortie-control-token, type: env, target: WORKBENCH_SORTIE_TOKEN}
      - {source: cp-workbench-password-hash, type: env, target: WORKBENCH_PASSWORD_HASH}
      - {source: cp-workbench-secret, type: env, target: WORKBENCH_SECRET_KEY}
      - {source: cp-github-token, type: env, target: WORKBENCH_GITHUB_TOKEN}
    healthcheck:
      test: ["CMD", "/usr/local/bin/cp-probe", "http://127.0.0.1:8793/api/auth/mode"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The only door for worker hosts: mTLS against the control plane's CA,
  # one route per flow, rendered by cpctl from the worker list.
  pomerium:
    image: docker.io/pomerium/pomerium:v0.33.6
    container_name: cp-pomerium
    restart: unless-stopped
    command: ["--config", "/pomerium/config.yaml"]
    volumes:
      - ${CP_HOME:?set CP_HOME to the control-plane directory}/pomerium:/pomerium:ro,z
    secrets:
      - cp-pomerium-cert
      - cp-pomerium-key
    networks: [internal, outside]
    ports:
      - "${CP_PUBLIC_BIND:-0.0.0.0}:${CP_PUBLIC_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "/bin/pomerium", "health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Behind Pomerium's egress route: admits each CONNECT by its job token
  # and tunnels it through nono.
  egress-gate:
    image: localhost/ortus-nova/control-plane:${CP_TAG:?}
    container_name: cp-egress-gate
    restart: unless-stopped
    command:
      - cp-egress
      - -listen=:7691
      - -sortie=http://10.89.71.10:7680
      - -control-token-file=/run/secrets/cp-sortie-control-token
      - -nono=nono:7690
      - -nono-pass-file=/run/secrets/cp-nono-pass
    secrets:
      - cp-sortie-control-token
      - cp-nono-pass
    networks: [internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/cp-probe", "tcp://127.0.0.1:7691"]
      interval: 10s
      timeout: 5s
      retries: 30

  # nono holds every platform credential. It allows only the hosts of its
  # profile, replaces a job's placeholder with the credential only on
  # requests to that credential's host, and logs every request (-v, to
  # standard error). Its standard output, which repeats its own proxy
  # credential, goes nowhere.
  nono:
    image: ghcr.io/nolabs-ai/nono:0.81.0
    container_name: cp-nono
    restart: unless-stopped
    stop_signal: SIGINT
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec nono proxy -v --listen 0.0.0.0 --port 7690
        --profile /etc/nono/egress-profile.json
        --proxy-ca-cert /run/secrets/cp-egress-ca-cert
        --proxy-ca-key /run/secrets/cp-egress-ca-key >/dev/null
    environment:
      NONO_NO_UPDATE_CHECK: "1"
    volumes:
      - ${CP_NONO_DIR:-./nono}:/etc/nono:ro,z
    secrets:
      - {source: cp-nono-pass, type: env, target: NONO_PROXY_PASS}
      - {source: cp-anthropic-token, type: env, target: CP_EGRESS_ANTHROPIC}
      - {source: cp-github-token, type: env, target: CP_EGRESS_GITHUB}
      - {source: cp-github-basic, type: env, target: CP_EGRESS_GITHUB_BASIC}
      - cp-egress-ca-cert
      - cp-egress-ca-key
    networks: [internal, outside]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7690"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Huly, the tracker: its entry (nginx) and its services. Inside the
  # project the entry is also reached by the name of its public URL, so
  # Sortie follows the URLs Huly's configuration gives browsers.
  huly:
    image: docker.io/library/nginx:stable-alpine
    container_name: cp-huly
    restart: unless-stopped
    depends_on: [huly-front, huly-account, huly-transactor, huly-collaborator]
    volumes:
      - ./huly/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks:
      internal:
        aliases: ["${CP_HULY_HOST:-huly.cp.internal}"]
      outside: {}
    ports:
      - "${CP_HULY_BIND:-127.0.0.1}:${CP_HULY_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8087/config.json"]
      interval: 10s
      timeout: 5s
      retries: 60

  huly-front:
    image: docker.io/hardcoreeng/front:v0.7.432
    container_name: cp-huly-front
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      ACCOUNTS_URL: http://${CP_HULY_HOST:-huly.cp.internal}:${CP_HULY_PORT:-8087}/_accounts
      COLLABORATOR_URL: ws://${CP_HULY_HOST:-huly.cp.internal}:${CP_HULY_PORT:-8087}/_collaborator
      UPLOAD_URL: /files
      STORAGE_CONFIG: minio|huly-minio?accessKey=minioadmin&secretKey=minioadmin
      STATS_URL: http://huly-stats:4900
      TITLE: Huly
      DEFAULT_LANGUAGE: en
      LAST_NAME_FIRST: "true"
      DESKTOP_UPDATES_CHANNEL: selfhost
    secrets:
      - {source: cp-huly-secret, type: env, target: SERVER_SECRET}
    networks: [internal]

  huly-account:
    image: docker.io/hardcoreeng/account:v0.7.432
    container_name: cp-huly-account
    restart: unless-stopped
    depends_on: [huly-cockroach, huly-redpanda, huly-minio]
    environment:
      ACCOUNT_PORT: "3000"
      DB_URL: postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: huly-redpanda:9092
      TRANSACTOR_URL: ws://huly-transactor:3333;ws://${CP_HULY_HOST:-huly.cp.internal}:${CP_HULY_PORT:-8087}/_transactor
      STORAGE_CONFIG: minio|huly-minio?accessKey=minioadmin&secretKey=minioadmin
      FRONT_URL: http://huly-front:8080
      STATS_URL: http://huly-stats:4900
      ACCOUNTS_URL: http://huly-account:3000
      MODEL_ENABLED: "*"
    secrets:
      - {source: cp-huly-secret, type: env, target: SERVER_SECRET}
    networks: [internal]

  huly-workspace:
    image: docker.io/hardcoreeng/workspace:v0.7.432
    container_name: cp-huly-workspace
    restart: unless-stopped
    depends_on: [huly-cockroach, huly-redpanda, huly-minio, huly-account]
    environment:
      DB_URL: postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      ACCOUNTS_DB_URL: postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: huly-redpanda:9092
      TRANSACTOR_URL: ws://huly-transactor:3333;ws://${CP_HULY_HOST:-huly.cp.internal}:${CP_HULY_PORT:-8087}/_transactor
      STORAGE_CONFIG: minio|huly-minio?accessKey=minioadmin&secretKey=minioadmin
      ACCOUNTS_URL: http://huly-account:3000
      STATS_URL: http://huly-stats:4900
      MODEL_ENABLED: "*"
    secrets:
      - {source: cp-huly-secret, type: env, target: SERVER_SECRET}
    networks: [internal]

  huly-transactor:
    image: docker.io/hardcoreeng/transactor:v0.7.432
    container_name: cp-huly-transactor
    restart: unless-stopped
    depends_on: [huly-cockroach, huly-redpanda, huly-minio, huly-account]
    environment:
      SERVER_PORT: "3333"
      DB_URL: postgresql://root@huly-cockroach:26257/defaultdb?sslmode=disable
      QUEUE_CONFIG: huly-redpanda:9092
      STORAGE_CONFIG: minio|huly-minio?accessKey=minioadmin&secretKey=minioadmin
      FRONT_URL: http://${CP_HULY_HOST:-huly.cp.internal}:${CP_HULY_PORT:-8087}
      ACCOUNTS_URL: http://huly-account:3000
      STATS_URL: http://huly-stats:4900
      LAST_NAME_FIRST: "true"
    secrets:
      - {source: cp-huly-secret, type: env, target: SERVER_SECRET}
    networks: [internal]

  huly-collaborator:
    image: docker.io/hardcoreeng/collaborator:v0.7.432
    container_name: cp-huly-collaborator
    restart: unless-stopped
    depends_on: [huly-account, huly-minio]
    environment:
      COLLABORATOR_PORT: "3078"
      ACCOUNTS_URL: http://huly-account:3000
      STORAGE_CONFIG: minio|huly-minio?accessKey=minioadmin&secretKey=minioadmin
      STATS_URL: http://huly-stats:4900
    secrets:
      - {source: cp-huly-secret, type: env, target: SECRET}
    networks: [internal]

  huly-stats:
    image: docker.io/hardcoreeng/stats:v0.7.432
    container_name: cp-huly-stats
    restart: unless-stopped
    environment:
      PORT: "4900"
    secrets:
      - {source: cp-huly-secret, type: env, target: SERVER_SECRET}
    networks: [internal]

  # Huly's stores, reachable only on the internal network.
  huly-cockroach:
    image: docker.io/cockroachdb/cockroach:latest-v24.3
    container_name: cp-huly-cockroach
    restart: unless-stopped
    command: ["start-single-node", "--insecure"]
    volumes:
      - huly-cockroach:/cockroach/cockroach-data
    networks: [internal]

  huly-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    container_name: cp-huly-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://huly-redpanda:9092
      - --rpc-addr=huly-redpanda:33145
      - --advertise-rpc-addr=huly-redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --memory=512M
    volumes:
      - huly-redpanda:/var/lib/redpanda/data
    networks: [internal]

  huly-minio:
    image: docker.io/minio/minio:latest
    container_name: cp-huly-minio
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    volumes:
      - huly-minio:/data
    networks: [internal]
