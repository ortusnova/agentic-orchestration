# The live tests' additions to compose.yaml (livetest/run.sh): a fake model
# API that nono's test profile (CP_NONO_DIR) binds the model credential
# to. Nothing here changes a service of the project.
services:
  fake-model:
    image: localhost/ortus-nova/cp-fakemodel:${CP_TAG:?}
    container_name: cp-fake-model
    user: "0"
    command: ["-listen", ":443"]
    volumes:
      - ${CP_LIVE_DIR:?}/model:/etc/fakemodel:ro,z
    networks:
      internal:
        aliases: [model.cp.test]
