# Huly's entry in the control plane's compose project: one origin for the
# front and the services a browser (and Sortie) reach through it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8087;
    server_name _;
    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;

    location /_accounts {
        rewrite ^/_accounts/?(.*)$ /$1 break;
        proxy_pass http://huly-account:3000;
    }

    location /_collaborator {
        rewrite ^/_collaborator/?(.*)$ /$1 break;
        proxy_pass http://huly-collaborator:3078;
    }

    location /_transactor {
        rewrite ^/_transactor/?(.*)$ /$1 break;
        proxy_pass http://huly-transactor:3333;
    }

    # A transactor URL whose path is the workspace token.
    location ~ ^/eyJ {
        proxy_pass http://huly-transactor:3333;
    }

    location /_rekoni {
        rewrite ^/_rekoni/?(.*)$ /$1 break;
        proxy_pass http://huly-rekoni:4004;
    }

    location /_stats {
        rewrite ^/_stats/?(.*)$ /$1 break;
        proxy_pass http://huly-stats:4900;
    }

    location / {
        proxy_pass http://huly-front:8080;
    }
}
