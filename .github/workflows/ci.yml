# Test and lint every component on each pull request and push to main.
# The jobs call the same Makefile targets as a local `make test lint`.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  OPENSPEC_VERSION: 1.13.0

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [acp-broker, control-plane, smol-builder, worker-daemon]
    env:
      # The worker daemon's end-to-end tests build Sortie from the sortie/
      # submodule, and the control plane's egress gate; with it checked out
      # they must run, not skip.
      WORKER_DAEMON_E2E_NO_SKIP: ${{ matrix.module == 'worker-daemon' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ matrix.module == 'worker-daemon' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: make -C ${{ matrix.module }} test
      - run: make -C ${{ matrix.module }} lint LINTER=golangci-lint
      # The worker daemon ships for linux/amd64, linux/arm64 and darwin/arm64.
      - if: matrix.module == 'worker-daemon'
        run: make -C worker-daemon cross

  workbench:
    name: Workbench
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # The session tests need the broker, and the schema contract test
      # needs the sortie/ submodule: without either they would skip.
      WORKBENCH_TEST_BROKER: ${{ github.workspace }}/acp-broker/bin/acp-broker
      WORKBENCH_TEST_NO_SKIP: "1"
      PYTEST_ADDOPTS: -rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: workbench/frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # The oldest Python that pyproject.toml allows.
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: workbench/uv.lock
      - run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}
      - run: make -C acp-broker build
      - run: npm ci
        working-directory: workbench/frontend
      - run: make -C workbench test
      - run: make -C workbench lint
      - run: make -C workbench wheel

  stage0:
    name: Stage-0 kit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # test-review-gate.sh builds against the sortie/ submodule; with it
      # checked out the test must run, not skip. test-egress-live.sh needs
      # nono and api.anthropic.com on p1: `make test` leaves it to test-live.
      STAGE0_TEST_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends shellcheck jq
      - run: make -C dev/stage0 test
      - run: make -C dev/stage0 lint

  repo:
    name: Licenses and specs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g @fission-ai/openspec@${{ env.OPENSPEC_VERSION }}
      - run: make licenses no-placeholder specs

  # The control plane's images, built here and tagged with the commit, and
  # its whole compose project started under rootless podman, as the runner's
  # unprivileged user, with test certificates and fake credentials; then
  # every scenario of agent-platform/control-plane runs against it.
  control-plane:
    name: Control plane (images, compose project, live scenarios)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "*/go.sum"
      - name: Install podman and podman-compose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman pipx
          # 1.5 or later runs each health check as its command, not
          # through /bin/sh, which the images built here do not have.
          pipx install podman-compose==1.6.0
          podman --version
          podman-compose --version
          podman info --format 'rootless: {{.Host.Security.Rootless}}'
      - name: Check every upstream image is pinned by digest
        run: make -C control-plane pins
      - name: Build the images, tagged with the commit
        run: make -C control-plane images
      - name: Start the project and run the scenarios
        run: make -C control-plane live-test

  # The telemetry store's compose project (control-plane/telemetry), under
  # rootless podman as the runner's unprivileged user: a span through the
  # collector into Langfuse, masked, then a backup, the volumes removed, a
  # restore, and the span read again.
  telemetry:
    name: Telemetry store (compose project, backup, restore)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install podman and podman-compose
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman pipx
          pipx install podman-compose==1.6.0
          podman --version
          podman-compose --version
          podman info --format 'rootless: {{.Host.Security.Rootless}}'
      - name: Check every image is pinned by digest
        run: make -C control-plane/telemetry pins
      - name: Start the project, send, back up, restore
        run: make -C control-plane/telemetry live-test
