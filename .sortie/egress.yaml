# The hosts this repository's jobs reach for its builds and tests (make
# test, make lint), besides the agent harness's (dev/stage0/WORKFLOW.md,
# environment.remote.egress) and the credential hosts nono serves. Sortie
# reads this file from the base branch and puts it in each job's offer; the
# worker allows each host directly (spec store
# agent-platform/job-egress-policy, format: Sortie's docs/egress.schema.json).
version: 1
hosts:
  - {host: proxy.golang.org, reason: "go downloads the Go modules and the go.work toolchain of every Go component"}
  - {host: sum.golang.org, reason: "go checks each module it downloads against the checksum database"}
  - {host: pypi.org, reason: "uv resolves the workbench's Python packages (workbench/uv.lock)"}
  - {host: files.pythonhosted.org, reason: "uv downloads the workbench's Python packages"}
  - {host: registry.npmjs.org, reason: "npm installs the workbench frontend's packages and openspec, which make lint runs"}
  - {host: github.com, reason: "uv downloads its Python builds from python-build-standalone's GitHub releases"}
